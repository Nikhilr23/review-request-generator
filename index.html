<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Request Generator</title><link rel="stylesheet" href="style.css"><script defer src="script.js"></script></head><body><main><header><span>Local business follow-up</span><h1>Ask for the review without sounding robotic.</h1><p>Generate an SMS and email request from a few job details. Template-powered, private, and free.</p></header><div class="grid"><form><label>Client first name<input id="name" value="Jordan"></label><label>Service performed<input id="service" value="home cleaning"></label><label>Business name<input id="business" value="Bright Home Cleaning"></label><label>Business type<input id="type" value="cleaning service"></label><label>Tone<select id="tone"><option>Friendly</option><option>Professional</option><option>Brief</option></select></label><label>Review link (optional)<input id="link" placeholder="Paste your review link"></label></form><section><article><small>SMS</small><p id="sms"></p><button data-copy="sms">Copy SMS</button></article><article><small>Email</small><p id="email"></p><button data-copy="email">Copy email</button></article></section></div></main></body></html>
